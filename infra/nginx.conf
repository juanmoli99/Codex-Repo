limit_req_zone $binary_remote_addr zone=operator_api:10m rate=10r/s;

server {
  listen 8443 ssl;
  server_name _;
  server_tokens off;

  ssl_certificate /run/secrets/tls_certificate;
  ssl_certificate_key /run/secrets/tls_private_key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:TLS:10m;
  ssl_session_timeout 10m;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  root /usr/share/nginx/html;
  index index.html;

  location = /proxy-health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location ~ ^/(api|health)/ {
    limit_req zone=operator_api burst=30 nodelay;
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

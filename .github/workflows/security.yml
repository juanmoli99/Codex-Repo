name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4

  filesystem-and-container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  container-images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - component: backend
            context: .
            file: Dockerfile.backend
          - component: frontend
            context: .
            file: Dockerfile.frontend
          - component: watchdog
            context: infra/watchdog
            file: infra/watchdog/Dockerfile
          - component: backup
            context: infra/backup
            file: infra/backup/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - run: docker build --pull --tag aegis-${{ matrix.component }}:security --file ${{ matrix.file }} ${{ matrix.context }}
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: aegis-${{ matrix.component }}:security
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
